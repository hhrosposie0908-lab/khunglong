<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Xem Video 360 Do</title>
    <!-- Nhúng thư viện A-Frame hỗ trợ VR và cảm biến xoay điện thoại -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Khai báo file video 360 độ -->
        <video id="video-360" src="video360.mp4" autoplay loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <!-- Gắn video vào quả cầu không gian VR -->
      <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>

      <!-- Camera điều khiển góc nhìn theo hướng xoay -->
      <a-camera look-controls></a-camera>
    </a-scene>
  </body>
</html>
